# Publish a production image to GHCR (docs/DEPLOYMENT_PLAN.md Phase D, D4).
#
# Triggered by a version tag, or by hand. Tags are cut from `main`, which CI
# protects, so the code in a release has already passed the full suite — but the
# image is smoke-tested here anyway before it is pushed, because publishing a
# broken image is how a bad rollback target gets created.
#
# The image is tagged with BOTH the version and the commit SHA. The SHA tag is
# what makes a deploy reproducible and a rollback a one-liner: set ERP_IMAGE to
# the previous SHA and `docker compose up -d`.
#
# The package is PRIVATE — it contains the application's source. Pulling it on the
# server therefore needs a read-only token; see the runbook.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (e.g. hotfix-1). The SHA tag is always published."
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/blyns-erp

jobs:
  publish:
    name: build, smoke-test and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets GITHUB_TOKEN push to this repository's own package registry, so no
      # separate secret is needed to PUBLISH. (Pulling on the server does need a
      # read-only token — that is a different credential, held only on the box.)
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: meta
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY,,}/${IMAGE_NAME,,}"
          SHA="${GITHUB_SHA::12}"
          TAGS="$IMAGE:sha-$SHA"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAGS="$TAGS,$IMAGE:${GITHUB_REF#refs/tags/},$IMAGE:latest"
          fi
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAGS="$TAGS,$IMAGE:${{ github.event.inputs.tag }}"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$IMAGE:sha-$SHA" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "publishing: $TAGS"

      # Build once, locally, and prove it before anything is pushed.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: blyns-erp:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the candidate
        run: |
          set -euo pipefail
          docker run -d --name mongo mongo:7
          docker run -d --name app --link mongo:mongo -p 8000:8000 \
            -e ERP_ENV=production \
            -e ERP_JWT_SECRET="$(openssl rand -hex 32)" \
            -e ERP_MONGO_URI="mongodb://mongo:27017" \
            -e ERP_CORS_ORIGINS='["https://blyns-eg.com"]' \
            blyns-erp:candidate
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/ | grep -q "<title>"
          docker exec app python scripts/migrate.py --list | grep -q "0001_"
          docker rm -f app mongo

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-runs the same build; every layer is a cache hit, so this is a push.
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha

      - name: Deploy instructions
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy on the server:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "sed -i 's|^ERP_IMAGE=.*|ERP_IMAGE=${{ steps.meta.outputs.sha_tag }}|' .env.production" >> "$GITHUB_STEP_SUMMARY"
          echo "docker compose --env-file .env.production -f docker-compose.prod.yml pull app" >> "$GITHUB_STEP_SUMMARY"
          echo "docker compose --env-file .env.production -f docker-compose.prod.yml up -d app" >> "$GITHUB_STEP_SUMMARY"
          echo "docker compose --env-file .env.production -f docker-compose.prod.yml exec -T app python scripts/migrate.py" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
