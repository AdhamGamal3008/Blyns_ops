# CI (docs/DEPLOYMENT_PLAN.md Phase D).
#
# Everything that must be true before code reaches main: ruff, mypy, tsc, the
# frontend suite, and the whole backend suite.
#
# Two things shape the backend job:
#
#   * A single full pytest run OOM-kills the ephemeral mongod roughly 70% of the
#     way through, producing a connection-refused cascade that looks like a pile
#     of real failures but is not. The suite is therefore SHARDED across runners —
#     each shard is a fresh machine with its own mongod, which sidesteps the
#     problem entirely and finishes faster than one long serial run.
#   * The shard split is computed from the directory listing, not hardcoded, so a
#     newly added test file is picked up automatically. A hardcoded list would let
#     new tests silently never run — the same class of bug as the mongod skip
#     guarded below.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match the production image (docs/DEPLOYMENT_PLAN.md G-7): testing on a
  # different minor than we ship is how a version-specific bug reaches production
  # having passed CI.
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  BACKEND_SHARDS: "4"

jobs:
  lint-backend:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: ruff
        working-directory: backend
        run: ruff check app tests ../scripts
      - name: mypy
        working-directory: backend
        run: mypy app

  frontend:
    name: tsc + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm ci` (not `npm install`) so the lockfile is authoritative — and so a
      # lockfile that has drifted out of sync fails here rather than at image
      # build time on a deploy day.
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Test
        working-directory: frontend
        run: npx vitest run

  # Proves the thing we actually ship. Catches a broken Dockerfile, a lockfile
  # that only fails on linux, and the bundled-localhost guard — none of which the
  # jobs above can see.
  image:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: blyns-erp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          docker run -d --name mongo mongo:7
          # ERP_ENV=production makes the app refuse to start on unsafe config, so
          # a clean startup here also proves validate_for_production is satisfied.
          docker run -d --name app --link mongo:mongo -p 8000:8000 \
            -e ERP_ENV=production \
            -e ERP_JWT_SECRET="$(openssl rand -hex 32)" \
            -e ERP_MONGO_URI="mongodb://mongo:27017" \
            -e ERP_CORS_ORIGINS='["https://blyns-eg.com"]' \
            blyns-erp:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          # The SPA must be served, not just the API.
          curl -fsS http://localhost:8000/ | grep -q "<title>"
          # And the operational scripts must be runnable in the deployed image,
          # or there is no way to migrate a production database.
          docker exec app python scripts/migrate.py --list | grep -q "0001_"
          docker rm -f app mongo

  backend:
    name: pytest (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # The integration suite boots a real mongod on a random port. Installed
      # from MongoDB's own apt repository rather than a third-party action.
      - name: Install MongoDB server
        run: |
          set -euo pipefail
          curl -fsSL https://pgp.mongodb.com/server-7.0.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-7.0.gpg
          echo "deb [signed-by=/usr/share/keyrings/mongodb-7.0.gpg] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-org-server

      # WITHOUT THIS THE SUITE LIES. conftest's mongo_uri fixture calls
      # pytest.skip() when the mongod binary is missing, so a failed install would
      # produce a green run that executed zero integration tests.
      - name: Assert mongod is present
        run: |
          command -v mongod || { echo "mongod missing — integration tests would SKIP, not fail"; exit 1; }
          mongod --version | head -1

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Unit tests
        if: matrix.shard == 0
        working-directory: backend
        run: python -m pytest tests/unit -q

      - name: Integration tests (this shard)
        working-directory: backend
        run: |
          set -euo pipefail
          FILES=$(ls tests/integration/test_*.py | awk "NR % ${BACKEND_SHARDS} == ${{ matrix.shard }}")
          if [ -z "$FILES" ]; then
            echo "no test files in this shard — the split is wrong"; exit 1
          fi
          echo "$FILES" | sed 's/^/  /'
          # shellcheck disable=SC2086
          python -m pytest $FILES -q

  # A single required check for branch protection, so adding a shard later does
  # not mean editing the protected-branch rule.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint-backend, frontend, image, backend]
    if: always()
    steps:
      - name: Verify every job succeeded
        run: |
          if echo '${{ join(needs.*.result, ",") }}' | grep -qE 'failure|cancelled'; then
            echo "a required job failed: ${{ join(needs.*.result, ',') }}"
            exit 1
          fi
          echo "all green"
